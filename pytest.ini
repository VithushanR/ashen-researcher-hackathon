[pytest]
# Both entries are load-bearing, and they serve different halves of the repo.
#
#   .    puts the repo root on sys.path, so `from src.api.main import app`
#        resolves no matter which directory pytest is invoked from, and so
#        `fixtures.fake_hybrid_search` (a root-level package) is importable.
#   src  puts src/ itself on sys.path, because Person B's agent modules import
#        each other as `from agent.state import ...`, not `from src.agent.state
#        import ...`. Without this entry tests/test_agent_loop.py cannot even be
#        collected: ModuleNotFoundError: No module named 'agent'.
#
# Keep both. Dropping `.` breaks Person D's tests; dropping `src` breaks Person
# B's. The runtime equivalent of this is _ensure_import_paths() in
# src/api/pipeline.py -- pytest.ini only fixes the path for the test process.
pythonpath = src .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# -ra shows a summary of everything that was not a plain pass, so a skipped or
# xfailed test cannot hide in a green run.
addopts = -ra --strict-markers

# Starlette's TestClient warns about httpx on import, and anyio warns about a
# deprecated alias underneath it. Neither is our code and neither is
# actionable, so they are filtered by exact message rather than blanket-ignored
# -- a real DeprecationWarning from our own code still surfaces.
#
# Note the categories differ: Starlette's is a UserWarning subclass, not a
# DeprecationWarning, despite the word "deprecated" in the message. Filtering
# it under the wrong category silently does nothing.
filterwarnings =
    error::DeprecationWarning:src.*
    error::DeprecationWarning:agent.*
    ignore:Using `httpx` with `starlette.testclient` is deprecated:UserWarning
    ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning
